name: Validate canonical index.html

on:
  workflow_dispatch:
  push:
    paths:
      - "*.html"
      - ".github/workflows/build_setup_v204_25_pnl_inicio.yml"

permissions:
  contents: read

concurrency:
  group: validate-canonical-index
  cancel-in-progress: true

jobs:
  validate:
    name: Validate index.html
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate canonical filename, version sync and required patches
        shell: bash
        run: |
          set -euo pipefail
          test -s index.html
          if find . -maxdepth 1 -type f \( -name 'setup_v204_tail_coinmetrics_price_mvrv.html' -o -name 'setup_v204_tail_coinmetrics_price_mvrv_v*.html' \) -print -quit | grep -q .; then
            echo "::error::Arquivo legado de setup encontrado. O setup canônico deve se chamar somente index.html."
            find . -maxdepth 1 -type f \( -name 'setup_v204_tail_coinmetrics_price_mvrv.html' -o -name 'setup_v204_tail_coinmetrics_price_mvrv_v*.html' \) -print
            exit 1
          fi
          grep -q 'PATCH_V204_25_VFL_REGIME_START_PRICE' index.html
          grep -Fq 'Início: ${fmt.usd2(vflPnl.start.price)}' index.html
          grep -q 'getCurrentVflRegimePnl' index.html
          grep -Fq '<title>Setup v204.29 —' index.html
          grep -Fq '<h1>Setup v204.29</h1>' index.html
          grep -q 'PATCH_V204_29_BINANCE_PNL_COST_BASIS' index.html
          if grep -Fq 'v200.9.63' index.html; then
            echo "::error::Versão visível antiga v200.9.63 ainda presente em index.html."
            exit 1
          fi
          echo "index.html canônico e versão v204.29 sincronizados: PASS"

      - name: Publish index artifact
        uses: actions/upload-artifact@v4
        with:
          name: btc-setup-index
          path: index.html
          if-no-files-found: error
