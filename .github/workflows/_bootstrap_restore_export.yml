name: Bootstrap Restore BTC Export

on:
  push:
    paths:
      - ".github/workflows/_bootstrap_restore_export.yml"
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  group: bootstrap-restore-btc-export
  cancel-in-progress: true

jobs:
  restore-export:
    runs-on: ubuntu-22.04
    timeout-minutes: 30
    env:
      TZ: UTC
      REQUIRE_NO_BINANCE_TAIL: "true"
      REQUIRE_YESTERDAY_UTC: "true"
      FRESHNESS_GRACE_UTC_HOUR: "15"
      BLOCK_BINANCE_VISUAL_IN_EXPORT: "true"
      SETUP_HTML_PATH: "setup_v204_tail_coinmetrics_price_mvrv.html"
      EXPORT_CSV_PATH: "data/btc_setup_export.csv"
      EXPORT_META_PATH: "data/btc_setup_export_meta.json"
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "20"

      - name: Validate files
        shell: bash
        run: |
          set -euo pipefail
          test -f "$SETUP_HTML_PATH"
          test -f scripts/export_setup_csv_playwright.mjs
          node --check scripts/export_setup_csv_playwright.mjs
          mkdir -p data

      - name: Install Node dependencies
        shell: bash
        run: |
          set -euo pipefail
          npm install --no-save playwright

      - name: Remove broken Microsoft/Azure apt sources
        shell: bash
        run: |
          set -euo pipefail
          sudo bash -c '
            shopt -s nullglob
            for f in /etc/apt/sources.list.d/*.list /etc/apt/sources.list.d/*.sources; do
              if grep -qiE "packages\.microsoft\.com|azure-cli" "$f"; then
                echo "Removing apt source: $f"
                rm -f "$f"
              fi
            done
            apt-get update
          '

      - name: Install Playwright Chromium
        shell: bash
        run: |
          set -euo pipefail
          npx playwright install --with-deps chromium

      - name: Regenerate export
        shell: bash
        run: |
          set -euo pipefail
          node scripts/export_setup_csv_playwright.mjs
          test -s "$EXPORT_CSV_PATH"
          test -s "$EXPORT_META_PATH"

      - name: Commit restored export
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add "$EXPORT_CSV_PATH" "$EXPORT_META_PATH"
          if git diff --cached --quiet; then
            echo "Export unchanged."
            exit 0
          fi
          git commit -m "Restore BTC setup export data"
          git pull --rebase
          git push
