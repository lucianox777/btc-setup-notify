name: Binance Read-Only Smoke Test

on:
  workflow_dispatch:
  push:
    paths:
      - "index.html"
      - "api/binance/**"
      - "scripts/binance_readonly_smoke_test.cjs"
      - ".github/workflows/binance_readonly_smoke_test.yml"
      - ".github/workflows/vercel_deploy.yml"

permissions:
  contents: read

concurrency:
  group: binance-readonly-smoke-test
  cancel-in-progress: true

jobs:
  smoke:
    name: Binance read-only integration
    runs-on: ubuntu-22.04
    timeout-minutes: 5
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: "24"

      - name: Syntax checks
        shell: bash
        run: |
          set -euo pipefail
          node --check api/binance/account.js
          node --check scripts/binance_readonly_smoke_test.cjs

      - name: Run read-only smoke test
        shell: bash
        run: |
          set -euo pipefail
          node scripts/binance_readonly_smoke_test.cjs
